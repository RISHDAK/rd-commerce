<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - R&D Commerce</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header>

    <div class="logo">

        <a href="index.html">

            <span class="logo-rd">
                R&D
            </span>

            <span class="logo-commerce">
                COMMERCE
            </span>

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>


        <button
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>


        <a
            href="login.html"
            id="userMenu"
        >
            Login
        </a>


        <a
            href="cart.html"
            class="cart-link"
        >

            🛒 Cart

            <span id="cart-count">
                0
            </span>

        </a>

    </nav>

</header>



<!-- ============================= -->
<!-- CART -->
<!-- ============================= -->

<section class="cart-section">


    <h1>
        Your Shopping Cart
    </h1>


    <div id="cart-items">

    </div>



    <!-- ========================= -->
    <!-- CART SUMMARY -->
    <!-- ========================= -->

    <div class="cart-summary">


        <h2>

            Total:
            ₹<span id="total">0</span>

        </h2>


        <div class="discount-box">


            <input
                type="text"
                id="coupon"
                placeholder="Enter coupon code"
                autocomplete="off"
            >


            <button
                type="button"
                onclick="applyCoupon()"
            >
                Apply
            </button>


        </div>


        <p>

            Discount:
            ₹<span id="discount">0</span>

        </p>


        <h2>

            Final Total:
            ₹<span id="finalTotal">0</span>

        </h2>


        <a href="checkout.html">

            <button
                type="button"
            >
                Proceed To Checkout
            </button>

        </a>


        <br>
        <br>


        <a href="shop.html">

            <button
                type="button"
            >
                Continue Shopping
            </button>

        </a>


    </div>


</section>



<!-- ============================= -->
<!-- TOAST -->
<!-- ============================= -->

<div id="toast-container"></div>



<!-- ============================= -->
<!-- BACK TO TOP -->
<!-- ============================= -->

<button
    id="backToTop"
    aria-label="Back to top"
>
    ↑
</button>



<!-- ============================= -->
<!-- SCRIPTS -->
<!-- ============================= -->

<script src="script.js"></script>

<script src="cart.js"></script>


</body>

</html>
