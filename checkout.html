<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - R&D Commerce</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header>

    <div class="logo">

        <a href="index.html">

            <span class="logo-rd">
                R&D
            </span>

            <span class="logo-commerce">
                COMMERCE
            </span>

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>


        <button
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>


        <a
            href="login.html"
            id="userMenu"
        >
            Login
        </a>


        <a
            href="cart.html"
            class="cart-link"
        >

            🛒 Cart

            <span id="cart-count">
                0
            </span>

        </a>

    </nav>

</header>



<!-- ============================= -->
<!-- CHECKOUT -->
<!-- ============================= -->

<section class="products">

    <h1>
        Checkout
    </h1>


    <div class="card">


        <!-- ========================= -->
        <!-- DELIVERY DETAILS -->
        <!-- ========================= -->

        <h2>
            Delivery Details
        </h2>


        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            autocomplete="name"
        >


        <br>
        <br>


        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
        >


        <br>
        <br>


        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            autocomplete="tel"
        >


        <br>
        <br>


        <textarea
            id="address"
            placeholder="Shipping Address"
            autocomplete="street-address"
        ></textarea>



        <!-- ========================= -->
        <!-- PAYMENT -->
        <!-- ========================= -->

        <h3>
            Payment Method
        </h3>


        <label>

            <input
                type="radio"
                name="payment"
                value="UPI"
            >

            UPI

        </label>


        <br>


        <label>

            <input
                type="radio"
                name="payment"
                value="Card"
            >

            Card

        </label>


        <br>


        <label>

            <input
                type="radio"
                name="payment"
                value="Cash On Delivery"
            >

            Cash On Delivery

        </label>



        <br>
        <br>



        <!-- ========================= -->
        <!-- ORDER -->
        <!-- ========================= -->

        <h3>
            Your Order
        </h3>


        <div id="checkout-items">

        </div>



        <h3>

            Subtotal:
            ₹<span id="checkout-subtotal">
                0
            </span>

        </h3>


        <h3>

            Discount:
            ₹<span id="checkout-discount">
                0
            </span>

        </h3>


        <h2>

            Total:
            ₹<span id="checkout-total">
                0
            </span>

        </h2>



        <br>


        <button
            type="button"
            onclick="placeOrder()"
        >
            Place Order
        </button>


    </div>

</section>



<!-- ============================= -->
<!-- TOAST -->
<!-- ============================= -->

<div id="toast-container"></div>



<!-- ============================= -->
<!-- BACK TO TOP -->
<!-- ============================= -->

<button
    id="backToTop"
    aria-label="Back to top"
>
    ↑
</button>



<!-- ============================= -->
<!-- SCRIPTS -->
<!-- ============================= -->

<script src="script.js"></script>


<script>

// =========================================================
// CHECKOUT SYSTEM
// =========================================================


// =========================================================
// LOAD CART
// =========================================================

function getCheckoutCart() {

    try {

        const savedCart =
            JSON.parse(
                localStorage.getItem("cart")
            );


        return Array.isArray(savedCart)
            ? savedCart
            : [];

    } catch (error) {

        return [];

    }

}


let cart =
    getCheckoutCart();


// =========================================================
// ELEMENTS
// =========================================================

const checkoutItems =
    document.getElementById(
        "checkout-items"
    );


const checkoutSubtotal =
    document.getElementById(
        "checkout-subtotal"
    );


const checkoutDiscount =
    document.getElementById(
        "checkout-discount"
    );


const checkoutTotal =
    document.getElementById(
        "checkout-total"
    );


// =========================================================
// DISPLAY CHECKOUT
// =========================================================

function displayCheckout() {

    if (!checkoutItems) {
        return;
    }


    // =====================================================
    // EMPTY CART
    // =====================================================

    if (cart.length === 0) {

        checkoutItems.innerHTML = `

            <div class="empty-cart">

                <h2>
                    Your cart is empty 🛒
                </h2>

                <p>
                    Add products before
                    proceeding to checkout.
                </p>


                <a href="shop.html">

                    <button type="button">
                        Continue Shopping
                    </button>

                </a>

            </div>

        `;


        checkoutSubtotal.innerText =
            "0";

        checkoutDiscount.innerText =
            "0";

        checkoutTotal.innerText =
            "0";


        return;

    }


    // =====================================================
    // CALCULATE SUBTOTAL
    // =====================================================

    let subtotal = 0;


    checkoutItems.innerHTML = "";


    cart.forEach(
        function (item) {

            const price =
                Number(item.price) || 0;


            subtotal += price;


            checkoutItems.innerHTML += `

                <div class="cart-card">

                    <img
                        src="${item.image || ""}"
                        alt="${item.name || "Product"}"
                    >


                    <div>

                        <h3>
                            ${item.name || "Product"}
                        </h3>


                        <p>
                            ₹${price.toLocaleString("en-IN")}
                        </p>

                    </div>

                </div>

            `;

        }
    );


    // =====================================================
    // DISCOUNT
    // =====================================================

    const savedDiscount =
        Number(
            localStorage.getItem(
                "discountAmount"
            )
        ) || 0;


    const discount =
        Math.min(
            Math.max(0, savedDiscount),
            subtotal
        );


    // =====================================================
    // FINAL TOTAL
    // =====================================================

    const finalTotal =
        Math.max(
            0,
            subtotal - discount
        );


    checkoutSubtotal.innerText =
        subtotal.toLocaleString(
            "en-IN"
        );


    checkoutDiscount.innerText =
        discount.toLocaleString(
            "en-IN"
        );


    checkoutTotal.innerText =
        finalTotal.toLocaleString(
            "en-IN"
        );

}


// =========================================================
// PLACE ORDER
// =========================================================

function placeOrder() {

    // -----------------------------------------------------
    // CART CHECK
    // -----------------------------------------------------

    if (cart.length === 0) {

        showCheckoutMessage(
            "Your cart is empty!",
            "🛒"
        );

        return;

    }


    // -----------------------------------------------------
    // GET DETAILS
    // -----------------------------------------------------

    const name =
        document
            .getElementById("fullName")
            .value
            .trim();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const phone =
        document
            .getElementById("phone")
            .value
            .trim();


    const address =
        document
            .getElementById("address")
            .value
            .trim();


    const payment =
        document.querySelector(
            'input[name="payment"]:checked'
        );


    // -----------------------------------------------------
    // VALIDATION
    // -----------------------------------------------------

    if (!name) {

        showCheckoutMessage(
            "Please enter your full name.",
            "⚠️"
        );

        return;

    }


    if (!email) {

        showCheckoutMessage(
            "Please enter your email.",
            "⚠️"
        );

        return;

    }


    if (!email.includes("@")) {

        showCheckoutMessage(
            "Please enter a valid email address.",
            "⚠️"
        );

        return;

    }


    if (!phone) {

        showCheckoutMessage(
            "Please enter your phone number.",
            "⚠️"
        );

        return;

    }


    if (!address) {

        showCheckoutMessage(
            "Please enter your shipping address.",
            "⚠️"
        );

        return;

    }


    if (!payment) {

        showCheckoutMessage(
            "Please select a payment method.",
            "⚠️"
        );

        return;

    }


    // -----------------------------------------------------
    // CALCULATE TOTAL
    // -----------------------------------------------------

    let subtotal = 0;


    cart.forEach(
        function (item) {

            subtotal +=
                Number(item.price) || 0;

        }
    );


    const savedDiscount =
        Number(
            localStorage.getItem(
                "discountAmount"
            )
        ) || 0;


    const discount =
        Math.min(
            Math.max(0, savedDiscount),
            subtotal
        );


    const finalTotal =
        Math.max(
            0,
            subtotal - discount
        );


    // -----------------------------------------------------
    // GENERATE ORDER ID
    // -----------------------------------------------------

    const orderId =
        "RD" +
        Date.now()
            .toString()
            .slice(-8);


    // -----------------------------------------------------
    // CREATE ORDER
    // -----------------------------------------------------

    const order = {

        orderId: orderId,

        customer: {

            name: name,

            email: email,

            phone: phone,

            address: address

        },

        paymentMethod:
            payment.value,

        items: cart,

        subtotal: subtotal,

        discount: discount,

        total: finalTotal,

        date:
            new Date()
                .toLocaleString(
                    "en-IN"
                ),

        status:
            "Order Placed"

    };


    // -----------------------------------------------------
    // LOAD OLD ORDERS
    // -----------------------------------------------------

    let orders = [];


    try {

        const savedOrders =
            JSON.parse(
                localStorage.getItem(
                    "orders"
                )
            );


        if (
            Array.isArray(
                savedOrders
            )
        ) {

            orders =
                savedOrders;

        }

    } catch (error) {

        orders = [];

    }


    // -----------------------------------------------------
    // SAVE ORDER
    // -----------------------------------------------------

    orders.push(order);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    // -----------------------------------------------------
    // SAVE LAST ORDER
    // -----------------------------------------------------

    localStorage.setItem(
        "lastOrder",
        JSON.stringify(order)
    );


    // -----------------------------------------------------
    // CLEAR CART
    // -----------------------------------------------------

    localStorage.removeItem(
        "cart"
    );


    localStorage.removeItem(
        "discountAmount"
    );


    // -----------------------------------------------------
    // GO TO SUCCESS PAGE
    // -----------------------------------------------------

    window.location.href =
        "order-success.html";

}


// =========================================================
// CHECKOUT MESSAGE
// =========================================================

function showCheckoutMessage(
    message,
    icon
) {

    if (
        typeof showToast ===
        "function"
    ) {

        showToast(
            message,
            icon
        );

    }

    else {

        alert(
            icon +
            " " +
            message
        );

    }

}


// =========================================================
// INITIALIZE
// =========================================================

displayCheckout();

</script>


</body>

</html>
