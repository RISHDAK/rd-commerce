<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - R&D Commerce</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">

        <a href="index.html">

            <span class="logo-rd">R&D</span>

            <span class="logo-commerce">
                COMMERCE
            </span>

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>

        <button
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>

        <a href="login.html" id="userMenu">
            Login
        </a>

        <a href="cart.html" class="cart-link">
            🛒 Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>



<section class="products">

    <div class="card order-success-card">


        <div class="success-icon">
            ✓
        </div>


        <h1>
            Thank You!
        </h1>


        <h2>
            Your Order Has Been Placed 🎉
        </h2>


        <p>
            Your order has been successfully placed.
        </p>


        <div class="order-summary">

            <p>
                <strong>Order ID:</strong>
                <span id="success-order-id">Loading...</span>
            </p>

            <p>
                <strong>Payment Method:</strong>
                <span id="success-payment">Loading...</span>
            </p>

            <p>
                <strong>Total Amount:</strong>
                ₹<span id="success-total">0</span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="success-status">Order Placed</span>
            </p>

        </div>


        <br>


        <a href="order-tracking.html">

            <button type="button">
                Track Your Order 🚚
            </button>

        </a>


        <br><br>


        <a href="index.html">

            <button type="button">
                Continue Shopping
            </button>

        </a>


    </div>

</section>



<div id="toast-container"></div>


<button
    id="backToTop"
    aria-label="Back to top"
>
    ↑
</button>



<script src="script.js"></script>


<script>

    // =========================================================
    // LOAD LAST ORDER
    // =========================================================

    function getLastOrder() {

        try {

            const savedOrder =
                JSON.parse(
                    localStorage.getItem("lastOrder")
                );

            return savedOrder &&
                   typeof savedOrder === "object"
                ? savedOrder
                : null;

        } catch (error) {

            return null;

        }

    }



    // =========================================================
    // DISPLAY ORDER DETAILS
    // =========================================================

    const lastOrder = getLastOrder();


    const orderId =
        document.getElementById(
            "success-order-id"
        );


    const payment =
        document.getElementById(
            "success-payment"
        );


    const total =
        document.getElementById(
            "success-total"
        );


    const status =
        document.getElementById(
            "success-status"
        );



    if (lastOrder) {

        if (orderId) {

            orderId.innerText =
                "#" + (
                    lastOrder.orderId ||
                    "N/A"
                );

        }


        if (payment) {

            payment.innerText =
                lastOrder.paymentMethod ||
                "N/A";

        }


        if (total) {

            total.innerText =
                Number(
                    lastOrder.total || 0
                ).toLocaleString("en-IN");

        }


        if (status) {

            status.innerText =
                lastOrder.status ||
                "Order Placed";

        }

    } else {

        if (orderId) {
            orderId.innerText = "N/A";
        }

        if (payment) {
            payment.innerText = "N/A";
        }

        if (total) {
            total.innerText = "0";
        }

        if (status) {
            status.innerText = "Order Not Found";
        }

    }

</script>


</body>

</html>
