<!DOCTYPE html>
<html>

<head>

<title>Order Confirmed - R&D Commerce</title>

<link rel="stylesheet" href="style.css">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

</head>


<body>


<header>

<div class="logo">
R&D <span>COMMERCE</span>
</div>


<nav>

<a href="index.html">
Home
</a>

<a href="shop.html">
Shop
</a>

<a href="order-tracking.html">
Track Order
</a>

</nav>

</header>



<section class="products">


<div class="card">


<h1>
🎉 Thank You!
</h1>


<h2>
Your Order Has Been Placed
</h2>


<p>
Your order has been successfully received.
</p>



<div class="order-info">


<h3>
Order ID
</h3>


<p>
<strong id="order-id">
Loading...
</strong>
</p>



<h3>
Order Total
</h3>


<p>
₹<strong id="order-total">
0
</strong>
</p>



<h3>
Payment Method
</h3>


<p id="payment-method">
Loading...
</p>



<h3>
Order Status
</h3>


<p id="order-status">
Order Placed ✅
</p>


</div>



<br>



<a href="order-tracking.html">

<button>

Track Your Order 🚚

</button>

</a>


<br><br>



<a href="index.html">

<button>

Continue Shopping 🛍️

</button>

</a>


</div>


</section>



<script>

// ===============================
// LOAD LAST ORDER
// ===============================

const order =
    JSON.parse(
        localStorage.getItem("lastOrder")
    );


// ===============================
// CHECK ORDER
// ===============================

if(!order){

    document.getElementById(
        "order-id"
    ).innerText =
        "No recent order found";

} else {


    // ORDER ID

    document.getElementById(
        "order-id"
    ).innerText =
        "#" + order.orderId;



    // TOTAL

    document.getElementById(
        "order-total"
    ).innerText =
        Number(order.total)
            .toLocaleString();



    // PAYMENT

    document.getElementById(
        "payment-method"
    ).innerText =
        order.paymentMethod;



    // STATUS

    document.getElementById(
        "order-status"
    ).innerText =
        order.status + " ✅";

}

</script>


</body>

</html>
