<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Order - R&D Commerce</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">

        <a href="index.html">

            <span class="logo-rd">
                R&D
            </span>

            <span class="logo-commerce">
                COMMERCE
            </span>

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>

        <button
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>

        <a
            href="login.html"
            id="userMenu"
        >
            Login
        </a>

        <a
            href="cart.html"
            class="cart-link"
        >
            🛒 Cart
            <span id="cart-count">
                0
            </span>
        </a>

    </nav>

</header>



<section class="products">


    <div class="card order-tracking-card">


        <h1>
            Track Your Order 🚚
        </h1>


        <p>
            Enter your Order ID to check your order status.
        </p>


        <div class="tracking-form">

            <input
                type="text"
                id="orderId"
                placeholder="Enter Order ID (e.g. RD12345678)"
                autocomplete="off"
                aria-label="Order ID"
            >


            <button
                type="button"
                onclick="trackOrder()"
            >
                Track Order
            </button>

        </div>


        <div
            id="status"
            class="order-status"
        ></div>


        <br>


        <a href="index.html">

            <button type="button">
                Continue Shopping
            </button>

        </a>


    </div>


</section>



<div id="toast-container"></div>


<button
    id="backToTop"
    aria-label="Back to top"
>
    ↑
</button>



<script src="script.js"></script>

<script src="order-tracking.js"></script>


</body>

</html>
