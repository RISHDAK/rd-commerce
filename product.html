<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product - R&D Commerce</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header>

    <div class="logo">

        <a href="index.html">

            <span class="logo-rd">
                R&D
            </span>

            <span class="logo-commerce">
                COMMERCE
            </span>

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>


        <button
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>


        <a
            href="login.html"
            id="userMenu"
        >
            Login
        </a>


        <a
            href="cart.html"
            class="cart-link"
        >

            🛒 Cart

            <span id="cart-count">
                0
            </span>

        </a>

    </nav>

</header>



<!-- ============================= -->
<!-- PRODUCT SECTION -->
<!-- ============================= -->

<section class="product-section">


    <!-- Product details are inserted by product.js -->

    <div id="product-details">

    </div>



    <!-- ========================= -->
    <!-- REVIEWS -->
    <!-- ========================= -->

    <div class="reviews">

        <h2>
            Customer Reviews
        </h2>


        <div class="rating-summary">

            <h3>
                ⭐⭐⭐⭐⭐ 4.8 out of 5
            </h3>

        </div>


        <div id="review-list">

        </div>


        <h3>
            Write a Review
        </h3>


        <div class="stars">
            ⭐⭐⭐⭐⭐
        </div>


        <textarea
            id="reviewText"
            placeholder="Write your experience..."
            aria-label="Write your review"
        ></textarea>


        <br>
        <br>


        <button
            type="button"
            onclick="addReview()"
        >
            Submit Review
        </button>

    </div>

</section>



<!-- ============================= -->
<!-- RELATED PRODUCTS -->
<!-- ============================= -->

<section class="related-products">

    <h2>
        You May Also Like
    </h2>


    <div id="related-products">

    </div>

</section>



<!-- ============================= -->
<!-- TOAST -->
<!-- ============================= -->

<div id="toast-container"></div>


<!-- ============================= -->
<!-- BACK TO TOP -->
<!-- ============================= -->

<button
    id="backToTop"
    aria-label="Back to top"
>
    ↑
</button>



<!-- ============================= -->
<!-- SCRIPTS -->
<!-- ============================= -->

<script src="products.js"></script>

<script src="script.js"></script>

<script src="product.js"></script>


</body>

</html>
