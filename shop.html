<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop - R&D Commerce</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">

        <a href="index.html">

            <span class="logo-rd">
                R&D
            </span>

            <span class="logo-commerce">
                COMMERCE
            </span>

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a
            href="shop.html"
            class="active"
        >
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>

        <button
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>

        <a
            href="login.html"
            id="userMenu"
        >
            Login
        </a>

        <a
            href="cart.html"
            class="cart-link"
        >
            🛒 Cart
            <span id="cart-count">
                0
            </span>
        </a>

    </nav>

</header>



<section class="products shop-page">


    <h1>
        Our Collection
    </h1>


    <p class="shop-subtitle">
        Discover premium products at unbeatable prices.
    </p>



    <!-- ============================= -->
    <!-- SHOP CONTROLS -->
    <!-- ============================= -->

    <div class="shop-controls">


        <div class="search-container">

            <input
                type="text"
                id="searchBox"
                placeholder="🔍 Search Products..."
                autocomplete="off"
                aria-label="Search products"
            >

        </div>


        <select
            id="sortProducts"
            aria-label="Sort products"
        >

            <option value="">
                Sort By
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

            <option value="rating">
                Highest Rated
            </option>

            <option value="discount">
                Biggest Discount
            </option>

        </select>


    </div>



    <!-- ============================= -->
    <!-- PRODUCTS -->
    <!-- ============================= -->

    <div
        id="product-container"
        class="product-grid"
    ></div>


</section>



<div id="toast-container"></div>


<button
    id="backToTop"
    aria-label="Back to top"
>
    ↑
</button>



<script src="products.js"></script>

<script src="script.js"></script>

<script src="shop.js"></script>


</body>

</html>
